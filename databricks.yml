# This is a Declarative Automation Bundle definition for valuation_lakehouse.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: valuation_lakehouse
  uuid: 44fc1aea-a0d5-4a8c-92df-b646d1fcfb07

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://adb-7405613122488761.1.azuredatabricks.net
    presets:
      tags:
        project: valuation
        environment: dev
        owner: hilal
    variables:
      catalog: valuation
      schema: ${workspace.current_user.short_name}
  prod:
    mode: production
    workspace:
      host: https://adb-7405613122488761.1.azuredatabricks.net
      root_path: /Shared/.bundle/${bundle.name}/${bundle.target}
    presets:
      tags:
        project: valuation
        environment: prod
        owner: hilal
    variables:
      catalog: valuation
      schema: prod
    permissions:
      - service_principal_name: 155e681b-e669-4fa4-a3ee-743a50b3a06c
        level: CAN_MANAGE
      - user_name: ahyalciner.us@gmail.com
        level: CAN_MANAGE