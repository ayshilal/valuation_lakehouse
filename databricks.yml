# This is a Declarative Automation Bundle definition for valuation_lakehouse.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: valuation_lakehouse
  uuid: 44fc1aea-a0d5-4a8c-92df-b646d1fcfb07

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://adb-7405613122488761.1.azuredatabricks.net
    variables:
      catalog: valuation
      schema: ${workspace.current_user.short_name}
  prod:
    mode: production
    workspace:
      host: https://adb-7405613122488761.1.azuredatabricks.net
      # We explicitly deploy to /Workspace/Users/ahyalciner.us@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/ahyalciner.us@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: valuation
      schema: prod
    permissions:
      - user_name: ahyalciner.us@gmail.com
        level: CAN_MANAGE
